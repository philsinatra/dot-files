# general {
#     lock_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock           # lock without turning off the display
#     before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock   # lock before sleep without scheduling display off
#     after_sleep_cmd = sleep 1 && omarchy-system-wake                # delay for PAM readiness, then turn display back on
#     inhibit_sleep = 3                                               # delay sleep until screen is locked
# }
#
# # Start screensaver after 5 minutes idle
# listener {
#     timeout = 300
#     on-timeout = pidof hyprlock || omarchy-launch-screensaver
# }
#
# # Lock 1 minute after screensaver (6 minutes idle) — display STAYS ON
# listener {
#     timeout = 360
#     on-timeout = OMARCHY_LOCK_ONLY=true omarchy-system-lock
#     on-resume = omarchy-system-wake
# }

# NOTE: No suspend listener by design. With the lid closed in clamshell mode,
# system suspend kills the signal to the external display and requires lifting
# the lid to wake. OMARCHY_LOCK_ONLY=true above also prevents omarchy-system-lock
# from running `omarchy-brightness-display off` (which calls `hyprctl dispatch dpms off`)
# 3 seconds after locking.

# ---------------------------------------------------------------------
# Omarchy default config (preserved for reference):
#
# Start screensaver after 2.5 minutes
# listener {
#     timeout = 150
#     on-timeout = pidof hyprlock || omarchy-launch-screensaver
# }
#
# Lock system after 5 minutes (screensaver resets idle timer, so have to
# just do half + 2s margin)
# listener {
#     timeout = 152
#     on-timeout = omarchy-system-lock
#     on-resume = omarchy-system-wake
# }
# ---------------------------------------------------------------------
# Start screensaver after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 min 2 sec — display STAYS ON at the lock screen.
# OMARCHY_LOCK_ONLY=true prevents omarchy-system-lock from running
# `omarchy-brightness-display off` 3 seconds after locking.
listener {
    timeout = 302
    on-timeout = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    on-resume = omarchy-system-wake
}

# Turn off the display 1 hour after lock (3902s = 302 + 3600). Keeps the
# Apple Display showing the lock screen for a full hour so it can be woken
# with the bluetooth keyboard without lifting the laptop lid.
listener {
    timeout = 3902
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

